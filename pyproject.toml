[project]
name = "retail-lakehouse"
version = "0.1.0"
description = "Weekly retail drops through Airflow, Spark and dbt, with verity as the quality gate."
requires-python = ">=3.12,<3.13"
# Airflow is installed separately against its constraints file; see scripts/setup.sh.
dependencies = ["pyarrow", "pandas"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "AIR"]
